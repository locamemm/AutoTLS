name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ios/**'
      - '.github/workflows/build-ipa.yml'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release:
        description: 'Tạo GitHub Release (true/false)?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build AutoTLS IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Danh sách Xcode có sẵn trên máy runner:"
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Generate Xcode Project with XcodeGen
        run: |
          brew install xcodegen || true
          cd ios
          echo "Đang sinh file dự án Xcode chuẩn với XcodeGen..."
          xcodegen generate --spec project.yml

      - name: Build iOS Application (.app)
        run: |
          cd ios
          mkdir -p ../build
          xcodebuild build \
            -project AutoTLS.xcodeproj \
            -scheme AutoTLS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Package .ipa File
        run: |
          APP_PATH=$(find build -name "AutoTLS.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "❌ Không tìm thấy AutoTLS.app trong thư mục build/"
            find build
            exit 1
          fi

          echo "✅ Tìm thấy AutoTLS.app tại: $APP_PATH. Đang đóng gói IPA..."
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y AutoTLS.ipa Payload
          echo "📦 Đã tạo thành công AutoTLS.ipa!"
          ls -lh AutoTLS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoTLS-iOS-IPA
          path: build/AutoTLS.ipa
          retention-days: 14

      - name: Create GitHub Release (Optional)
        if: ${{ github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build/AutoTLS.ipa
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
